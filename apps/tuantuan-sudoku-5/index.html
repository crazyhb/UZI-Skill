<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5DBE7E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="团团5×5" />
  <meta name="format-detection" content="telephone=no" />
  <title>团团数独 · 5×5 拼图版</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <!-- 字体异步加载：国内访问 Google Fonts 慢时不阻塞页面，退回系统字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    :root {
      --sky: #5bb8d4;
      --sky-soft: #d7f1f8;
      --grape: #c084fc;
      --grape-soft: #efe2ff;
      --sun: #ffc857;
      --leaf: #5dbe7e;
      --coral: #ff7a6e;
      --ink: #243035;
      --muted: #5f7278;
      --board: #fffdf8;
      --line: #2c4a52;
      --shadow: 0 12px 30px rgba(36, 48, 53, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Nunito", "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 50% at 0% 0%, rgba(93, 190, 126, 0.32), transparent 55%),
        radial-gradient(ellipse 80% 48% at 100% 0%, rgba(91, 184, 212, 0.4), transparent 52%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 200, 87, 0.25), transparent 55%),
        linear-gradient(160deg, #e9f9ee 0%, #eaf6fb 52%, #fff6e8 100%);
      background-attachment: fixed;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(12px + env(safe-area-inset-top))
        calc(10px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom))
        calc(10px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }

    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; animation: pop 0.35s ease; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    @keyframes glowWin {
      0%, 100% { box-shadow: var(--shadow); }
      50% { box-shadow: 0 0 0 6px rgba(93, 190, 126, 0.32), var(--shadow); }
    }
    @keyframes confettiFall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hero {
      text-align: center;
      padding: 22px 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mascot {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      animation: bounce 2.6s ease-in-out infinite;
      background:
        radial-gradient(circle at 34% 32%, #fff 0 11%, transparent 12%),
        radial-gradient(circle at 66% 32%, #fff 0 11%, transparent 12%),
        radial-gradient(circle at 34% 32%, #243035 0 4.5%, transparent 5.5%),
        radial-gradient(circle at 66% 32%, #243035 0 4.5%, transparent 5.5%),
        radial-gradient(circle at 50% 64%, #ff8d7a 0 7%, transparent 8%),
        radial-gradient(circle at 50% 55%, #ffc857 0%, #ffb03a 72%, #f0a04b 100%);
      box-shadow: var(--shadow);
      position: relative;
    }

    .mascot::after {
      content: "5";
      position: absolute;
      right: -6px;
      bottom: -4px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--leaf);
      color: #fff;
      font-family: "Nunito", sans-serif;
      font-weight: 800;
      font-size: 17px;
      line-height: 38px;
      text-align: center;
    }

    .brand {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(2.1rem, 8.5vw, 2.8rem);
      letter-spacing: 0.04em;
      text-shadow: 3px 4px 0 rgba(93, 190, 126, 0.5);
    }

    .tagline {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
      max-width: 330px;
    }

    .mode-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }

    .mode-btn {
      appearance: none;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      background: #fff;
      border-radius: 24px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .mode-btn:active { transform: scale(0.98); }
    .mode-icon {
      width: 58px; height: 58px; border-radius: 18px;
      display: grid; place-items: center;
      font-family: "ZCOOL KuaiLe", sans-serif; font-size: 1.2rem;
    }
    .mode-btn[data-level="starter"] .mode-icon { background: #ffe7b0; }
    .mode-btn[data-level="easy"] .mode-icon { background: #d9f3e2; }
    .mode-btn[data-level="smart"] .mode-icon { background: #dcf3fb; }
    .mode-title { font-family: "ZCOOL KuaiLe", sans-serif; font-size: 1.28rem; }
    .mode-desc { font-size: 0.86rem; color: var(--muted); margin-top: 2px; }
    .chev { color: var(--leaf); font-size: 1.5rem; font-weight: 800; }

    .theme-bar {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.6);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .theme-bar label { font-weight: 800; font-size: 0.9rem; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      appearance: none; border: 2px solid transparent; background: #fff;
      border-radius: 999px; padding: 7px 13px; font-family: inherit;
      font-weight: 800; font-size: 0.84rem; cursor: pointer; min-height: 40px;
    }
    .chip.active { border-color: var(--leaf); background: #dff5e6; color: #226b3c; }
    .hint-note { margin-top: 12px; text-align: center; font-size: 0.82rem; color: var(--muted); line-height: 1.45; }
    .sibling-link {
      display: inline-block; margin: 10px auto 0; color: #1d6175; font-weight: 800;
      font-size: 0.88rem; text-decoration: none; padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,0.7);
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 8px;
    }
    .pill-btn {
      appearance: none; border: none; background: #fff; box-shadow: var(--shadow);
      border-radius: 999px; padding: 9px 14px; min-height: 44px; font-family: inherit;
      font-weight: 800; font-size: 0.95rem; cursor: pointer; color: var(--ink);
      white-space: nowrap;
    }
    .pill-btn:active, .pal-btn:active, .big-btn:active, .chip:active { transform: scale(0.95); }
    .status {
      font-family: "ZCOOL KuaiLe", sans-serif; font-size: 1rem; color: var(--muted);
      text-align: center; flex: 1;
    }

    .board-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      width: min(100%, 480px);
      /* 竖屏手机：给下方图案和按钮留约 290px，棋盘最小 300px */
      width: min(100%, 480px, max(300px, calc(100dvh - 250px - env(safe-area-inset-top) - env(safe-area-inset-bottom))));
      aspect-ratio: 1;
      flex-shrink: 0;
      background: var(--board);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 3px solid var(--line);
      touch-action: manipulation;
      position: relative;
    }
    .board.win { animation: glowWin 1.1s ease infinite; }

    .board.loading::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.7);
    }

    .cell {
      appearance: none;
      border: 1px solid rgba(44, 74, 82, 0.14);
      background: transparent;
      display: grid;
      place-items: center;
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(1.7rem, 10vw, 2.8rem);
      line-height: 1;
      cursor: pointer;
      padding: 0;
      color: var(--ink);
      position: relative;
      min-width: 0;
      overflow: hidden;
    }
    .cell.num { font-family: "Nunito", sans-serif; font-weight: 800; font-size: clamp(1.6rem, 9vw, 2.5rem); }
    /* 5 块拼图的颜色 */
    .cell.reg-0 { background: #fff3d6; }
    .cell.reg-1 { background: #dcf3fb; }
    .cell.reg-2 { background: #e2f7e6; }
    .cell.reg-3 { background: #ffe4e1; }
    .cell.reg-4 { background: #ece2fb; }
    .cell.reg-5 { background: #ffe9d2; }
    .cell.reg-6 { background: #dfeeff; }
    .cell.reg-7 { background: #f1f7d9; }
    .cell.reg-8 { background: #ffe3f0; }
    .cell.reg-9 { background: #d9f5f0; }
    .cell.reg-10 { background: #f3ecdc; }

    .cell.given { font-weight: 800; cursor: default; }
    .cell.peer { filter: brightness(0.95); }
    .cell.selected {
      outline: 3px solid var(--sun);
      outline-offset: -3px;
      z-index: 2;
      background: #ffe28a !important;
    }
    .cell.same { box-shadow: inset 0 0 0 3px rgba(93, 190, 126, 0.75); }
    .cell.error { background: #ffc4be !important; animation: shake 0.28s ease; }
    .cell.ok-flash { background: #c8f0d4 !important; }
    .cell.player { color: #226b3c; }

    .palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: min(100%, 420px);
    }
    .pal-btn {
      appearance: none; border: none; height: 64px; border-radius: 18px;
      background: #fff; box-shadow: var(--shadow);
      font-family: "ZCOOL KuaiLe", cursive; font-size: 2rem;
      cursor: pointer; color: var(--ink); position: relative; min-width: 0;
    }
    .pal-btn.num { font-family: "Nunito", sans-serif; font-weight: 800; font-size: 1.7rem; }
    .pal-btn small {
      position: absolute; right: 5px; bottom: 3px;
      font-size: 0.66rem; font-family: Nunito, sans-serif; color: var(--muted);
    }
    .pal-btn.active { background: var(--sun); }
    .pal-btn.blocked { opacity: 0.35; }
    .pal-btn.done { opacity: 0.28; }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(100%, 360px);
    }
    .feedback {
      min-height: 1.35em; text-align: center;
      font-family: "ZCOOL KuaiLe", sans-serif; font-size: 1.05rem; color: var(--muted);
    }
    .feedback.good { color: #2f8a4e; }
    .feedback.bad { color: #c24b45; }

    .result-panel {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 14px;
    }
    .result-panel h2 { font-family: "ZCOOL KuaiLe", cursive; font-size: 2.1rem; }
    .big-btn {
      appearance: none; border: none; cursor: pointer; padding: 14px 24px;
      border-radius: 999px; font-family: "ZCOOL KuaiLe", sans-serif;
      font-size: 1.18rem; box-shadow: var(--shadow); min-height: 48px;
    }
    .big-btn.primary { background: var(--sun); }
    .big-btn.secondary { background: #fff; }
    .action-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
    .confetti i {
      position: absolute; top: -12px; width: 10px; height: 16px; border-radius: 2px;
      animation: confettiFall 1.6s linear forwards;
    }

    @media (max-width: 600px) {
      .palette, .tools { width: 100%; }
      .pal-btn { height: 62px; font-size: 2rem; }
      .hero { padding-top: 10px; }
      .mode-btn { padding: 14px 14px; }
    }

    @media (orientation: portrait) and (max-height: 620px) {
      .topbar { margin-bottom: 4px; }
      .board-wrap, .controls { gap: 5px; }
      .pal-btn { height: 52px; font-size: 1.7rem; }
      .feedback { font-size: 0.95rem; }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      .app { max-width: 940px; }
      .topbar { margin-bottom: 4px; }
      .board-wrap { flex-direction: row; gap: 16px; }
      .board {
        width: min(55vw, calc(100vh - 90px));
        width: min(55vw, calc(100dvh - 90px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
      }
      .controls { width: min(42vw, 360px); }
      .palette, .tools { width: 100%; }
      .palette { grid-template-columns: repeat(5, 1fr); }
      .pal-btn { height: min(56px, 15vh); }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="home" class="screen active">
      <div class="hero">
        <div class="mascot" aria-hidden="true"></div>
        <h1 class="brand">团团数独 5×5</h1>
        <p class="tagline">最适合第一次玩数独的小朋友：5 块彩色拼图当"宫"，每块 5 格。同一行、同一列、同一块拼图里，图案都不能重复</p>
      </div>

      <div class="mode-list">
        <button type="button" class="mode-btn" data-level="starter">
          <span class="mode-icon">5格</span>
          <span>
            <div class="mode-title">启蒙 5×5</div>
            <div class="mode-desc">只空 5 格，每块拼图缺一个，找找"少了谁"</div>
          </span>
          <span class="chev">›</span>
        </button>
        <button type="button" class="mode-btn" data-level="easy">
          <span class="mode-icon">9</span>
          <span>
            <div class="mode-title">轻松 5×5</div>
            <div class="mode-desc">空 9 格，看行、看列、再看拼图块</div>
          </span>
          <span class="chev">›</span>
        </button>
        <button type="button" class="mode-btn" data-level="smart">
          <span class="mode-icon">13</span>
          <span>
            <div class="mode-title">聪明 5×5</div>
            <div class="mode-desc">空 13 格，团团自己想一想</div>
          </span>
          <span class="chev">›</span>
        </button>
      </div>

      <div class="theme-bar">
        <label>格子里放什么</label>
        <div class="chips" id="themeChips">
          <button type="button" class="chip active" data-theme="emoji">水果</button>
          <button type="button" class="chip" data-theme="animal">小动物</button>
          <button type="button" class="chip" data-theme="number">数字</button>
        </div>
      </div>
      <p class="hint-note">小提示：先看这一块拼图还缺哪个水果，再看它这一行、这一列有没有了。</p>
      <a class="sibling-link" href="../tuantuan-sudoku/index.html">会了？去玩 9×9 团团数独 →</a>
    </section>

    <section id="play" class="screen">
      <div class="topbar">
        <button type="button" class="pill-btn" id="backBtn">← 回家</button>
        <div class="status" id="status">点空格，再选图案</div>
        <button type="button" class="pill-btn" id="newBtn">新题</button>
      </div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="5×5 拼图数独棋盘"></div>
        <div class="controls">
          <p class="feedback" id="feedback">先点一个空格哦</p>
          <div class="palette" id="palette"></div>
          <div class="tools">
            <button type="button" class="pill-btn" id="eraseBtn">擦掉</button>
            <button type="button" class="pill-btn" id="hintBtn">提示</button>
            <button type="button" class="pill-btn" id="checkBtn">检查</button>
          </div>
        </div>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="result-panel">
        <div class="mascot" style="animation:none;width:92px;height:92px;"></div>
        <h2>团团通关啦！</h2>
        <p class="tagline" id="resultMsg">5×5 都填对了，真棒！</p>
        <div class="action-row">
          <button type="button" class="big-btn primary" id="againBtn">再来一局</button>
          <button type="button" class="big-btn secondary" id="homeBtn">回首页</button>
        </div>
      </div>
    </section>
  </div>
  <div class="confetti" id="confetti" hidden></div>

  <script src="sudoku5.js"></script>
  <script>
    const S = window.TuantuanSudoku5;
    const N = S.SIZE;
    const THEMES = {
      emoji: ["🍎", "🍌", "🍇", "🍊", "🍓"],
      animal: ["🐶", "🐱", "🐰", "🐻", "🐸"],
      number: ["1", "2", "3", "4", "5"],
    };

    const state = {
      theme: "emoji",
      level: "starter",
      regions: [],
      solution: [],
      puzzle: [],
      grid: [],
      given: [],
      selected: -1,
      paletteValue: 0,
    };

    const el = {
      home: document.getElementById("home"),
      play: document.getElementById("play"),
      result: document.getElementById("result"),
      board: document.getElementById("board"),
      palette: document.getElementById("palette"),
      feedback: document.getElementById("feedback"),
      status: document.getElementById("status"),
      resultMsg: document.getElementById("resultMsg"),
      confetti: document.getElementById("confetti"),
    };

    function show(screen) {
      [el.home, el.play, el.result].forEach((s) => s.classList.remove("active"));
      screen.classList.add("active");
      window.scrollTo(0, 0);
    }

    function buzz(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.95;
      u.pitch = 1.12;
      const voices = speechSynthesis.getVoices();
      const zh = voices.find((v) => /zh[-_]?CN|Chinese/i.test(v.lang + v.name));
      if (zh) u.voice = zh;
      speechSynthesis.speak(u);
    }
    if (window.speechSynthesis) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    function isNumTheme() {
      return state.theme === "number";
    }

    function startGame(level) {
      state.level = level;
      show(el.play);
      newPuzzle();
    }

    function newPuzzle() {
      el.board.classList.remove("win");
      el.board.classList.add("loading");
      el.status.textContent = "团团在摆拼图…";
      el.feedback.className = "feedback";
      el.feedback.textContent = "马上就好";
      // 让"摆拼图"提示先画出来，再做出题计算
      setTimeout(() => {
        const pack = S.newPuzzle(state.level);
        state.regions = pack.regions;
        state.solution = pack.solution;
        state.puzzle = pack.puzzle;
        state.grid = pack.puzzle.slice();
        state.given = pack.puzzle.map((v) => v !== 0);
        state.selected = -1;
        state.paletteValue = 0;
        el.board.classList.remove("loading");
        el.feedback.textContent = "先点一个空格哦";
        el.status.textContent = "还剩 " + S.emptyCount(state.grid) + " 格";
        renderBoard();
        renderPalette();
        speak("开始玩五乘五啦");
      }, 30);
    }

    function renderBoard() {
      const sym = THEMES[state.theme];
      el.board.innerHTML = "";
      const sel = state.selected;
      const [sr, sc] = sel >= 0 ? S.rc(sel) : [-1, -1];
      const sreg = sel >= 0 ? state.regions[sel] : -1;
      const selVal = sel >= 0 ? state.grid[sel] : 0;

      for (let i = 0; i < N * N; i++) {
        const [r, c] = S.rc(i);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell reg-" + state.regions[i] + (isNumTheme() ? " num" : "");
        btn.dataset.i = String(i);
        if (state.given[i]) btn.classList.add("given");
        if (!state.given[i] && state.grid[i]) btn.classList.add("player");
        if (i === sel) btn.classList.add("selected");
        else if (sel >= 0 && (r === sr || c === sc || state.regions[i] === sreg)) btn.classList.add("peer");
        if (selVal && state.grid[i] === selVal) btn.classList.add("same");
        const e = S.regionEdges(state.regions, i);
        if (e.right && c < N - 1) btn.style.borderRight = "2.5px solid var(--line)";
        if (e.bottom && r < N - 1) btn.style.borderBottom = "2.5px solid var(--line)";
        btn.textContent = state.grid[i] ? sym[state.grid[i] - 1] : "";
        btn.addEventListener("click", () => selectCell(i));
        el.board.appendChild(btn);
      }
    }

    function renderPalette() {
      const sym = THEMES[state.theme];
      const left = S.remainingCounts(state.grid);
      const legal =
        state.selected >= 0 && !state.given[state.selected] && !state.grid[state.selected]
          ? S.candidates(state.grid, state.regions, state.selected)
          : null;
      el.palette.innerHTML = "";
      for (let v = 1; v <= N; v++) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pal-btn" + (isNumTheme() ? " num" : "");
        if (state.paletteValue === v) b.classList.add("active");
        if (left[v] <= 0) b.classList.add("done");
        if (legal && !legal.includes(v)) b.classList.add("blocked");
        b.textContent = sym[v - 1];
        const mark = document.createElement("small");
        mark.textContent = left[v];
        b.appendChild(mark);
        b.addEventListener("click", () => pickSymbol(v));
        el.palette.appendChild(b);
      }
    }

    function selectCell(i) {
      if (state.given[i]) {
        state.selected = i;
        renderBoard();
        renderPalette();
        el.feedback.className = "feedback";
        el.feedback.textContent = "这是题目给的，不能改哦";
        return;
      }
      state.selected = i;
      renderBoard();
      if (state.paletteValue) {
        placeValue(state.paletteValue);
      } else {
        renderPalette();
        el.feedback.className = "feedback";
        el.feedback.textContent = "再点下面的图案填进去";
      }
    }

    function pickSymbol(v) {
      state.paletteValue = v;
      renderPalette();
      if (state.selected >= 0 && !state.given[state.selected]) {
        placeValue(v);
      } else {
        el.feedback.className = "feedback";
        el.feedback.textContent = "先点棋盘上的空格";
      }
    }

    function placeValue(val) {
      const i = state.selected;
      if (i < 0 || state.given[i]) return;
      state.grid[i] = val;
      renderBoard();
      renderPalette();
      const cell = el.board.children[i];
      if (!S.isValidPlace(state.grid, state.regions, i, val)) {
        cell.classList.add("error");
        el.feedback.className = "feedback bad";
        el.feedback.textContent = "哎呀，这一行、列或这块拼图有重复";
        speak("有重复哦");
        buzz([60, 40, 60]);
      } else {
        cell.classList.add("ok-flash");
        el.feedback.className = "feedback good";
        el.feedback.textContent = "放得不错！";
        el.status.textContent = "还剩 " + S.emptyCount(state.grid) + " 格";
        if (S.isSolved(state.grid, state.solution)) setTimeout(winGame, 280);
      }
    }

    function eraseSelected() {
      const i = state.selected;
      if (i < 0 || state.given[i]) {
        el.feedback.textContent = "先点一个你填过的空格";
        return;
      }
      state.grid[i] = 0;
      renderBoard();
      renderPalette();
      el.status.textContent = "还剩 " + S.emptyCount(state.grid) + " 格";
      el.feedback.className = "feedback";
      el.feedback.textContent = "擦掉啦，再选一个图案";
    }

    function giveHint() {
      const empties = [];
      for (let i = 0; i < N * N; i++) {
        if (!state.given[i] && state.grid[i] !== state.solution[i]) empties.push(i);
      }
      if (!empties.length) {
        el.feedback.className = "feedback good";
        el.feedback.textContent = "已经全对啦！";
        return;
      }
      empties.sort(
        (a, b) => S.candidates(state.grid, state.regions, a).length - S.candidates(state.grid, state.regions, b).length
      );
      const i = empties[0];
      state.selected = i;
      state.grid[i] = state.solution[i];
      state.given[i] = true;
      renderBoard();
      renderPalette();
      el.board.children[i].classList.add("ok-flash");
      el.status.textContent = "还剩 " + S.emptyCount(state.grid) + " 格";
      el.feedback.className = "feedback good";
      el.feedback.textContent = "提示来啦 ★";
      speak("提示来啦");
      if (S.isSolved(state.grid, state.solution)) setTimeout(winGame, 350);
    }

    function checkBoard() {
      let empty = 0;
      let wrong = 0;
      for (let i = 0; i < N * N; i++) {
        if (!state.grid[i]) empty += 1;
        else if (state.grid[i] !== state.solution[i]) wrong += 1;
      }
      if (!empty && !wrong) {
        winGame();
        return;
      }
      if (wrong) {
        el.feedback.className = "feedback bad";
        el.feedback.textContent = "还有 " + wrong + " 个不太对，再看看～";
        speak("再看看哦");
      } else {
        el.feedback.className = "feedback";
        el.feedback.textContent = "还剩 " + empty + " 个空格，加油团团！";
        speak("还剩" + empty + "个空格");
      }
    }

    function burstConfetti() {
      el.confetti.hidden = false;
      el.confetti.innerHTML = "";
      const colors = ["#ffc857", "#5bb8d4", "#5dbe7e", "#ff7a6e", "#c084fc"];
      for (let i = 0; i < 48; i++) {
        const bit = document.createElement("i");
        bit.style.left = Math.random() * 100 + "%";
        bit.style.background = colors[i % colors.length];
        bit.style.animationDelay = Math.random() * 0.35 + "s";
        bit.style.transform = "rotate(" + Math.random() * 180 + "deg)";
        el.confetti.appendChild(bit);
      }
      setTimeout(() => {
        el.confetti.hidden = true;
        el.confetti.innerHTML = "";
      }, 2100);
    }

    function winGame() {
      el.board.classList.add("win");
      el.feedback.className = "feedback good";
      el.feedback.textContent = "全部正确！";
      el.status.textContent = "通关！";
      burstConfetti();
      buzz([80, 60, 80, 60, 160]);
      speak("团团通关啦，真棒");
      const names = { starter: "启蒙", easy: "轻松", smart: "聪明" };
      el.resultMsg.textContent = names[state.level] + " 5×5 完成啦，5 块拼图都拼对了！";
      setTimeout(() => show(el.result), 900);
    }

    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => startGame(btn.dataset.level));
    });
    document.querySelectorAll("#themeChips .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll("#themeChips .chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        state.theme = chip.dataset.theme;
      });
    });
    document.getElementById("backBtn").onclick = () => {
      if (window.speechSynthesis) speechSynthesis.cancel();
      show(el.home);
    };
    document.getElementById("newBtn").onclick = newPuzzle;
    document.getElementById("eraseBtn").onclick = eraseSelected;
    document.getElementById("hintBtn").onclick = giveHint;
    document.getElementById("checkBtn").onclick = checkBoard;
    document.getElementById("againBtn").onclick = () => startGame(state.level);
    document.getElementById("homeBtn").onclick = () => show(el.home);

    document.addEventListener("keydown", (e) => {
      if (!el.play.classList.contains("active")) return;
      if (e.key >= "1" && e.key <= "5") pickSymbol(Number(e.key));
      if (e.key === "Backspace" || e.key === "Delete") eraseSelected();
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
