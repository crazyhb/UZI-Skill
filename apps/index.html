<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5BB8D4" />
  <title>团团的小游戏</title>
  <link rel="icon" href="tuantuan-sudoku/icon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Nunito", sans-serif;
      color: #243035;
      background:
        radial-gradient(ellipse 90% 50% at 0% 0%, rgba(255, 200, 87, 0.38), transparent 55%),
        radial-gradient(ellipse 80% 48% at 100% 0%, rgba(192, 132, 252, 0.3), transparent 52%),
        linear-gradient(160deg, #e7f7fb 0%, #fff6e8 52%, #f1e9fd 100%);
      background-attachment: fixed;
    }
    .app {
      max-width: 520px; margin: 0 auto; min-height: 100dvh;
      padding: calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 8vw, 2.6rem); letter-spacing: 0.06em; text-shadow: 3px 4px 0 rgba(255, 200, 87, 0.55); }
    p { color: #5f7278; line-height: 1.5; }
    .card {
      display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 14px;
      background: #fff; border-radius: 26px; padding: 18px; text-decoration: none; color: inherit;
      box-shadow: 0 12px 30px rgba(36, 48, 53, 0.12); text-align: left;
    }
    .card:active { transform: scale(0.98); }
    .card img { width: 72px; height: 72px; border-radius: 20px; }
    .card b { font-size: 1.3rem; display: block; }
    .card small { color: #5f7278; font-size: 0.9rem; }
    .card span:last-child { font-size: 1.6rem; color: #5bb8d4; font-weight: 800; }
  </style>
</head>
<body>
  <div class="app">
    <h1>团团的小游戏</h1>
    <p>选一个开始玩吧</p>
    <a class="card" href="tuantuan-sudoku-5/index.html">
      <img src="tuantuan-sudoku-5/icon-180.png" alt="" />
      <span><b>团团数独 5×5</b><small>第一次玩从这里开始，5 块彩色拼图</small></span>
      <span>›</span>
    </a>
    <a class="card" href="tuantuan-sudoku/index.html">
      <img src="tuantuan-sudoku/icon-180.png" alt="" />
      <span><b>团团数独 9×9</b><small>经典九宫格，水果 / 小动物 / 数字</small></span>
      <span>›</span>
    </a>
    <a class="card" href="tuantuan-sudoku-11/index.html">
      <img src="tuantuan-sudoku-11/icon-180.png" alt="" />
      <span><b>团团数独 11×11</b><small>11 块彩色拼图当"宫"，更大更好玩</small></span>
      <span>›</span>
    </a>
    <p style="font-size:0.85rem">小提示：在手机浏览器里点「分享 → 添加到主屏幕」，就能像 App 一样打开。</p>
  </div>
</body>
</html>
