name: 团团数独 · 发布到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/index.html"
      - "apps/tuantuan-sudoku/**"
      - "apps/tuantuan-sudoku-5/**"
      - "apps/tuantuan-sudoku-11/**"
      - ".github/workflows/tuantuan-sudoku-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 核心逻辑测试
        run: |
          node apps/tuantuan-sudoku/tests/sudoku.test.cjs
          node apps/tuantuan-sudoku-5/tests/sudoku5.test.cjs
          node apps/tuantuan-sudoku-11/tests/sudoku11.test.cjs

      - name: 准备站点文件
        run: |
          mkdir -p _site/tuantuan-sudoku _site/tuantuan-sudoku-5 _site/tuantuan-sudoku-11
          cp apps/index.html _site/
          cp apps/tuantuan-sudoku-5/{index.html,sudoku5.js,sw.js,manifest.webmanifest,icon.svg,icon-180.png,icon-512.png} _site/tuantuan-sudoku-5/
          cp apps/tuantuan-sudoku/{index.html,sudoku.js,sw.js,manifest.webmanifest,icon.svg,icon-180.png,icon-512.png} _site/tuantuan-sudoku/
          cp apps/tuantuan-sudoku-11/{index.html,sudoku11.js,sw.js,manifest.webmanifest,icon.svg,icon-180.png,icon-512.png} _site/tuantuan-sudoku-11/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
